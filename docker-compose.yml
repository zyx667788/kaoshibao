version: '3.8'

services:
  kaoshibao:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kaoshibao
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      # 输出目录映射到宿主机
      - ./output:/app/output
      # 日志目录
      - ./logs:/app/logs
      # 进度文件持久化（可选）
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    # 健康检查（Dockerfile已定义，这里可覆盖）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5678/api/chrome-status')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # 网络模式（host模式可直接访问宿主机Chrome，但不推荐生产环境）
    # network_mode: host

  # 可选: Nginx反向代理
  # nginx:
  #   image: nginx:alpine
  #   container_name: kaoshibao-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf.template:/etc/nginx/conf.d/default.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - kaoshibao

networks:
  default:
    name: kaoshibao-network