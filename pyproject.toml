[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["output", "data", "logs", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
ignore = [
    "E501",  # line too long (已用 line-length 控制)
    "B008",  # Flask 中常见默认参数调用
    "E402",  # 模块级 import 位置（项目有条件初始化）
]

[tool.ruff.lint.isort]
known-first-party = ["scraper_core", "logging_config", "app", "scrape"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
